<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zeitsprung Redaktion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Konzept: Nachtredaktion des fiktiven Geschichts-Magazins ZEITSPRUNG. Dunkelblaue Wand, Schreibtischlampe in Bernstein, roter Faden als Leitmotiv. Redakteur Mats Winter führt per Chat. Bewusst nur ein Look. */
:root{--ink:#0b1424;--panel:#15233a;--panel2:#1d3050;--line:#2f4670;--tx:#eef3ff;--mute:#9fb0d3;--amber:#ffb347;--red:#e8505b;--mint:#4bd6a0;--sky:#79c3ff;color-scheme:dark;--fh:'Bricolage Grotesque','Trebuchet MS',sans-serif;--fb:'Nunito Sans','Segoe UI',system-ui,sans-serif}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--tx);font-family:var(--fb);font-size:16px;line-height:1.45;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
#bg{position:fixed;inset:0;z-index:0;transition:opacity .8s,filter .8s}
#bg svg{width:100%;height:100%;display:block}
#bg.dim{opacity:.28;filter:blur(3px)}
.app,#intro{position:relative;z-index:1}
.app{max-width:780px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:12px}
.app[hidden]{display:none}
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{margin-right:auto;line-height:1.05}
.brand b{display:block;font-family:var(--fh);font-weight:800;font-size:1.35rem;letter-spacing:.14em}
.brand small{color:var(--amber);font-weight:700;letter-spacing:.08em;font-size:.72rem;text-transform:uppercase}
.stars{font-family:var(--fh);font-weight:800;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--amber);font-variant-numeric:tabular-nums}
.lv{display:flex;gap:6px;width:100%}
.lv div{flex:1;min-width:0;text-align:center;padding:6px 2px;border-radius:12px;background:#15233acc;border:1px solid var(--line);font-size:.78rem;color:var(--mute);transition:.25s}
.lv div b{display:block;font-size:1.15rem;line-height:1.2}
.lv div span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv .now{background:var(--amber);border-color:var(--amber);color:#2a1700;transform:translateY(-2px)}
.lv .done{background:#12392f;border-color:var(--mint);color:var(--mint)}
.log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:6px 2px 10px;scroll-behavior:smooth}
.row{display:flex;gap:10px;align-items:flex-end;animation:pop .28s ease-out}
.row.me{justify-content:flex-end}
.av{flex:none;width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--amber);box-shadow:0 0 0 2px #0b1424}
.who{display:block;font-size:.72rem;font-weight:700;letter-spacing:.05em;color:var(--amber);text-transform:uppercase;margin-bottom:2px}
.bub{max-width:min(86%,560px);padding:10px 14px;border-radius:18px 18px 18px 6px;background:#15233af2;border:1px solid var(--line);overflow-wrap:anywhere}
.me .bub{background:linear-gradient(135deg,#e8505b,#c23a6d);border:0;border-radius:18px 18px 6px 18px;color:#fff}
.bub p{margin:0}.bub p+p{margin-top:6px}
.bub .ok{color:var(--mint);font-weight:700}
.bub .tip{color:var(--amber);font-weight:700}
.dang{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:.93rem}
.typing{display:flex;gap:5px;padding:14px 16px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--mute);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mission{align-self:stretch;display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:18px;background:linear-gradient(120deg,#1d3050f0,#3a2447f0);border:1px solid var(--line);animation:pop .4s ease-out}
.mission .big{font-size:2.3rem}
.mission h2{margin:0;font-family:var(--fh);font-size:1.25rem}
.mission small{color:var(--amber);font-weight:700;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font:inherit;color:var(--tx);background:var(--panel2);border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;cursor:pointer;text-align:left;transition:.15s}
.chip:hover{border-color:var(--sky)}
.chip[aria-pressed=true]{background:#12392f;border-color:var(--mint)}
.chip[aria-pressed=true]::before{content:"✓ ";color:var(--mint);font-weight:800}
.chip:disabled{opacity:.6;cursor:default}
.go{font:inherit;font-weight:800;border:0;border-radius:14px;padding:10px 18px;background:var(--amber);color:#2a1700;cursor:pointer}
.go:disabled{opacity:.5;cursor:default}
.ex{margin-top:10px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#080e1a;text-align:center}
.ex .t{padding:10px 12px;font-family:var(--fh);font-weight:800;font-size:1.05rem;background:#fff;color:#111}
.ex .pic{padding:18px;font-size:3.2rem;background:linear-gradient(135deg,#2e4b86,#7a3f78)}
.ex small{display:block;padding:6px;color:var(--mute)}
.memebox{display:flex;gap:10px;align-items:center;background:#15233af2;border:1px solid var(--line);border-radius:16px;padding:8px}
.memebox[hidden]{display:none}
.memebox img{flex:none;max-width:38%;max-height:150px;border-radius:10px;object-fit:contain;background:#080e1a;cursor:zoom-in}
.memebox.big{flex-direction:column;align-items:stretch}
.memebox.big img{max-width:100%;max-height:46vh;cursor:zoom-out}
.memebox .cap{flex:1;min-width:0;font-size:.85rem;color:var(--mute)}
.memebox .cap b{display:block;color:var(--tx);font-family:var(--fh)}
.memebox button{font:inherit;font-size:.8rem;color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:10px;padding:4px 8px;cursor:pointer}
.dock{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.starters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.starters button{flex:none;font:inherit;font-size:.85rem;color:var(--sky);background:#0b1424cc;border:1px dashed var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.comp{display:flex;gap:8px;align-items:flex-end}
.comp textarea{flex:1;min-width:0;resize:none;font:inherit;color:var(--tx);background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:10px 14px;height:48px;max-height:120px}
.comp textarea:focus{outline:2px solid var(--sky);outline-offset:1px}
.btn{flex:none;height:48px;border:0;border-radius:16px;font:inherit;font-weight:800;cursor:pointer}
#send{width:52px;background:var(--red);color:#fff;font-size:1.2rem}
#hint{padding:0 12px;background:var(--panel2);color:var(--amber);border:1.5px solid var(--line)}
#up{width:48px;background:var(--panel2);border:1.5px solid var(--line);font-size:1.15rem}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

/* Intro */
#hero{position:fixed;z-index:0;top:0;right:max(0px,calc(50% - 520px));width:min(78vw,520px);height:64vh;pointer-events:none;opacity:.95;
 -webkit-mask-image:linear-gradient(to right,transparent 0,#000 40%,#000 78%,transparent 100%),linear-gradient(to bottom,#000 55%,transparent 100%);-webkit-mask-composite:source-in;
 mask-image:linear-gradient(to right,transparent 0,#000 40%,#000 78%,transparent 100%),linear-gradient(to bottom,#000 55%,transparent 100%);mask-composite:intersect}
#hero img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
#hero[hidden]{display:none}
#intro{min-height:100%;display:flex;align-items:flex-end;justify-content:center;padding-block:16px}
#intro[hidden]{display:none}
.story{width:100%;max-width:640px;background:#0b1424e6;border:1px solid var(--line);border-radius:22px;padding:20px 22px;backdrop-filter:blur(4px);animation:pop .5s ease-out}
.story .mast{font-family:var(--fh);font-weight:800;letter-spacing:.18em;font-size:.95rem;color:var(--amber)}
.story .mast span{color:var(--mute);letter-spacing:.06em;font-weight:600;font-size:.8rem;margin-left:8px}
.story h1{font-family:var(--fh);font-size:1.7rem;line-height:1.1;margin:8px 0 10px;text-wrap:balance}
.story p{margin:0 0 10px;font-size:1.02rem}
.story .dots{display:flex;gap:6px;margin:14px 0 4px}
.story .dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.story .dots i.on{background:var(--amber)}
.nxbtn,#nx{position:fixed;z-index:5;top:max(14px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));box-shadow:0 4px 16px #0008}
#nx[hidden]{display:none}
.story .acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.story input{font:inherit;color:var(--tx);background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;flex:1;min-width:150px}
.story .skip{font:inherit;color:var(--mute);background:none;border:0;text-decoration:underline;cursor:pointer;margin-left:auto}

/* Artikel */
.art{margin-top:10px;background:#f3f1ea;color:#15171c;border-radius:12px;padding:14px 16px;font-size:.92rem}
.art .m{font-family:var(--fh);font-weight:800;letter-spacing:.16em;font-size:.8rem;border-bottom:2px solid #15171c;padding-bottom:4px;display:flex;justify-content:space-between}
.art .m span{color:#c0392b}
.art h3{font-family:var(--fh);font-size:1.35rem;line-height:1.1;margin:10px 0 2px}
.art .by{color:#555;font-size:.8rem;margin-bottom:8px}
.art h4{margin:10px 0 2px;font-family:var(--fh);font-size:.82rem;letter-spacing:.07em;text-transform:uppercase;color:#a33}
.art p{margin:0 0 4px!important;color:#15171c}
.badge{font-size:3rem;text-align:center}
@media (max-width:480px){.lv div span{display:none}.bub{max-width:90%}.story h1{font-size:1.45rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
[hidden]{display:none!important}
img{max-width:100%}
</style>
</head>

var QUOTES=/„[^“”]*[“”]|"[^"]*"|»[^«]*«/g;
function factcheck(t0){
  var t=t0.replace(QUOTES,' ');
  var out=[],ents=[],ms,seen={};
  FACTS.forEach(function(f){var g=new RegExp(f.re.source,'gi');while((ms=g.exec(t))){ents.push({i:ms.index,e:ms.index+ms[0].length,f:f});if(ms[0].length===0)g.lastIndex++}});
  function near(si,ei,max,mode){var best=null,bd=1e9;ents.forEach(function(e){
    if(mode==='year'&&e.f.skipYear)return;if(mode==='era'&&e.f.selfEra)return;
    var d=e.e<=si?si-e.e:(e.i>=ei?(e.i-ei)+3:0);if(d<bd){bd=d;best=e}});return best&&bd<=max?best:null}
  var yr=/\b(\d{3,4})\b(?!\s*(?:v\.?\s*Chr|vor Chr))/g,ym;
  while((ym=yr.exec(t))){var y=+ym[1];if(y<500||y>1990)continue;
    var be=near(ym.index,ym.index+ym[0].length,70,'year');
    if(be&&(y<be.f.lo||y>be.f.hi)&&!seen[be.f.info]){seen[be.f.info]=1;out.push('Bei der Jahreszahl <b>'+y+'</b> stimmt etwas nicht. '+be.f.info)}}
  var CW={erste:1,zweite:2,dritte:3,vierte:4,fünfte:5,sechste:6,siebte:7,achte:8,neunte:9,zehnte:10,elfte:11,zwölfte:12,dreizehnte:13,vierzehnte:14,fünfzehnte:15,sechzehnte:16,siebzehnte:17,achtzehnte:18,neunzehnte:19,zwanzigste:20,einundzwanzigste:21};
  var cr=/(\d{1,2})\s*\.\s*jahrhundert|([a-zäöü]+?)n?\s+jahrhundert/gi,cm;
  while((cm=cr.exec(t))){var c=cm[1]?+cm[1]:CW[(cm[2]||'').toLowerCase()];if(!c)continue;
    if(/v\.?\s*chr/i.test(t.slice(cm.index,cm.index+cm[0].length+12)))continue;
    var ce=near(cm.index,cm.index+cm[0].length,90,'era');if(!ce)continue;
    var st0=(c-1)*100+1,en0=c*100;
    if((ce.f.hi<st0||ce.f.lo>en0)&&!seen[ce.f.info+'#c']){seen[ce.f.info+'#c']=1;out.push('Die Angabe <b>'+c+'. Jahrhundert</b> passt nicht. '+ce.f.info)}}
  var ER=[['steinzeit',-1000000,-800],['antike',-800,500],['mittelalter',500,1500],['fr(ü|ue)hen? neuzeit',1500,1800],['neuzeit',1500,2100],['moderne',1800,2100]];
  ER.forEach(function(er){var g=new RegExp(er[0],'gi'),m2;while((m2=g.exec(t))){var ee=near(m2.index,m2.index+m2[0].length,90,'era');if(!ee)continue;
    if((ee.f.hi<er[1]||ee.f.lo>er[2])&&!seen[ee.f.info+'#e']){seen[ee.f.info+'#e']=1;out.push('Die Zeit „'+m2[0]+'“ passt nicht zu dieser Angabe. '+ee.f.info)}}});
  FACTS.forEach(function(f){(f.bad||[]).forEach(function(b){if(b.re.test(t)&&!seen[b.fix]){seen[b.fix]=1;out.push(b.fix)}})});
  MYTHS.forEach(function(m){var g=new RegExp(m.re.source,'gi'),mm;while((mm=g.exec(t))){
    var win=t.slice(Math.max(0,mm.index-40),mm.index+mm[0].length+60);
    if(!m.noguard&&/\b(kein|keine|keinen|nicht|nie|niemals|mythos|klischee|erfunden|falsch|propaganda|verharmlos\w*|unwahr|begriff)\b/i.test(win))continue;
    if(!seen[m.fix]){seen[m.fix]=1;out.push(m.fix)}}});
  var th=THEMES.filter(function(x){return x.re.test(t)});
  return {errors:out,known:ents.length>0,themes:th};
}

async function go(n){
  if(n>=STEPS.length){await finish();return}
  i=n;var st=STEPS[i];hintsUsed=0;attempts=0;sel={};busy=true;setDock(false,st);hud();
  if(st.lvl>=0&&st.lvl!==shownLevel){shownLevel=st.lvl;mission(st.lvl);await new Promise(function(r){setTimeout(r,500)})}
  var r=await bot(st.ask,st.kind==='text'?700:600);
  if(st.extra==='example'){
    var b=document.createElement('div');b.className='chips';
    b.innerHTML='<button class="chip" id="exb">🧪 Beispiel-Meme ansehen</button>';
    r.querySelector('.bub').appendChild(b);
    b.firstChild.onclick=function(){b.firstChild.disabled=true;r.querySelector('.bub').insertAdjacentHTML('beforeend','<div class="ex"><div class="t">Wenn du Russland im Winter erobern willst …</div><div class="pic">🥶📱🎩</div><div class="t">… aber dein Handy nur noch 5 % hat</div><small>Erfundenes Übungs-Meme. Tippe als Titel zum Beispiel „Napoleon-Akku“.</small></div>');inp.value='Napoleon-Akku';grow();scroll()}

function renderChoice(r,st){

  st.opts.forEach(function(o){var b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed','false');b.textContent=o.t;
    b.onclick=function(){if(!st.multi){wrap.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed','false')});sel={}}
      var on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);if(on)sel[o.id]=1;else delete sel[o.id];ok.disabled=false};
    wrap.appendChild(b)});
  var ok=document.createElement('button');ok.className='go';ok.textContent='Fertig ✅';ok.disabled=true;

    var picked=st.opts.filter(function(o){return sel[o.id]});

    for(var k=0;k<picked.length;k++){await bot('<p>'+picked[k].r+'</p>',600)}

  i=STEPS.length;hud();setDock(false,{});hintB.disabled=true;startersEl.innerHTML='';inp.placeholder='Artikel fertig!';

  var prob=tidy(P('Problem').replace(/^problematisch ist,? dass\s+/i,'Problematisch ist, dass '));

  prob=prob.replace(/^Problematisch ist, dass /,'Insbesondere ist problematisch, dass ');

  var bsC=bs&&txtS?bs.replace(/[.]+$/,'')+'; dazu lautet der Meme-Text: „'+txt.replace(/[.]+$/,'')+'“.':[bs,txtS].filter(Boolean).join(' ');

  var gq=gesch;if(gesch&&quelle){gq=gesch.replace(/[.]+$/,'')+' (Quelle: '+quelle.replace(/[.]+$/,'').replace(/^Laut Lehrkraft: /,'Lehrkraft: ')+').'}

  // --- Sprach-Check

  if(slangHit.length)tips.push('<b>Sachlicher schreiben:</b> In einem Artikel passen Umgangswörter nicht. Ersetze '+slangHit.slice(0,3).join(', ')+'.');
